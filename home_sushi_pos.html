<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Sushi Viseu — POS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface2: #eeece8;
    --border: rgba(0,0,0,0.07);
    --border2: rgba(0,0,0,0.13);
    --accent: #c41230;
    --accent-dim: rgba(196,18,48,0.07);
    --text: #111111;
    --text-muted: #555;
    --text-dim: #aaa;
    --red: #c41230;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 3px solid var(--accent);
    background: #111111;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-mark {
    height: 44px;
    display: flex; align-items: center;
    background: #ffffff;
    border-radius: 8px;
    padding: 4px 10px;
  }
  .logo-mark img { height: 40px; width: auto; display: block; }
  .logo-mark .logo-fallback {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #ffffff;
  }
  .logo-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #ffffff;
  }
  .logo-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-top: 1px;
  }
  .header-date {
    font-family: var(--mono);
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }
  .server-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-left: 20px;
  }
  .server-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s;
  }
  .server-dot.online  { background: #3cb96a; }
  .server-dot.offline { background: var(--red); }

  /* LAYOUT */
  .main {
    display: flex;
    flex: 1;
    gap: 0;
    overflow: hidden;
  }

  /* LEFT — coluna esquerda (produtos + pedido empilhados) */
  .col-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .col-produtos {
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
  }
  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border2);
  }

  .product-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    margin-bottom: 8px;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .product-row:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .product-row.active {
    border-left-color: var(--accent);
    background: var(--accent-dim);
  }
  .product-cat {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .product-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .product-price {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text-muted);
    margin-left: auto;
    white-space: nowrap;
  }
  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    overflow: hidden;
  }
  .qty-btn {
    width: 36px; height: 36px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, color 0.1s;
    line-height: 1;
    font-family: var(--mono);
  }
  .qty-btn:hover { background: var(--border2); color: var(--text); }
  .qty-num {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    min-width: 32px;
    text-align: center;
    color: var(--text);
    padding: 0 4px;
  }

  /* PEDIDO — em baixo dos produtos */
  .col-pedido {
    flex: 1;
    padding: 20px 28px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .order-lines {
    flex: 1;
    overflow-y: auto;
  }
  .order-line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .order-line:last-child { border-bottom: none; }
  .ol-name {
    font-size: 13px;
    color: var(--text);
    max-width: 160px;
    line-height: 1.3;
    font-weight: 600;
  }
  .ol-qty {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .ol-sub {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
  }
  .empty-msg {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    padding: 2rem 0;
    font-family: var(--mono);
  }
  .total-block {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 2px solid var(--accent);
  }
  .total-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .total-val {
    font-family: var(--mono);
    font-size: 32px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .btn-row {
    margin-top: 20px;
    display: flex;
    gap: 8px;
  }
  .btn-print {
    flex: 1;
    padding: 13px 8px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: opacity 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-print:hover { opacity: 0.88; }
  .btn-print:active { transform: scale(0.98); }
  .btn-print:disabled {
    background: var(--surface2);
    color: var(--text-dim);
    cursor: not-allowed;
    opacity: 1;
  }
  .btn-finalize {
    flex: 1;
    padding: 13px 8px;
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-finalize:hover { background: var(--surface2); }
  .btn-finalize:disabled {
    color: var(--text-dim);
    border-color: var(--border);
    cursor: not-allowed;
  }
  /* EDITAR PEDIDO */
  .edit-banner {
    display: none;
    background: #fff8e1;
    border: 1px solid #f0c040;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: #7a5c00;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .edit-banner.visible { display: flex; }
  .edit-banner-cancel {
    background: none; border: none;
    color: #7a5c00; cursor: pointer;
    font-size: 15px; line-height: 1;
    padding: 0 2px;
  }
  .btn-edit {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    padding: 3px 8px;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    white-space: nowrap;
  }
  .btn-edit:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .obs-area {
    margin-top: 14px;
  }
  .obs-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: block;
  }
  .obs-input {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    resize: none;
    height: 64px;
    transition: border-color 0.15s;
  }
  .obs-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .obs-input::placeholder { color: var(--text-dim); }

  .btn-clear {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .btn-clear:hover { border-color: var(--red); color: var(--red); background: rgba(217,54,54,0.05); }

  /* RIGHT — HISTÓRICO */
  .col-historico {
    width: 300px;
    padding: 24px 20px;
    overflow-y: auto;
    background: var(--bg);
  }
  .hist-empty {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    padding: 2rem 0;
  }
  .hist-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .hist-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #f9f8f6;
  }
  .hist-num {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 2px 7px;
    border-radius: 4px;
  }
  .hist-time {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    flex: 1;
  }
  .hist-total {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }
  .hist-body {
    padding: 12px 14px;
  }
  .hist-item {
    font-size: 12px;
    color: var(--text);
    line-height: 2;
    font-family: var(--mono);
  }

  /* PRINT */
  @media print {
    body > * { display: none !important; }
    #print-area { display: block !important; }
  }
  #print-area { display: none; }

  /* MODAL */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 28px;
    width: 360px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  .modal h2 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 18px;
    color: var(--text);
  }
  .modal label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: block;
    margin-bottom: 6px;
  }
  .modal select {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    margin-bottom: 20px;
    appearance: none;
    cursor: pointer;
  }
  .modal-actions { display: flex; gap: 8px; }
  .btn-modal-save {
    flex: 1; padding: 11px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px;
    font-family: var(--sans); font-size: 13px;
    font-weight: 700; cursor: pointer;
  }
  .btn-modal-cancel {
    padding: 11px 18px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 8px;
    font-family: var(--sans); font-size: 13px;
    color: var(--text-muted); cursor: pointer;
  }
  .server-status { cursor: pointer; }
  .server-status:hover .server-label { text-decoration: underline; }

  /* SCROLLBAR — global (subtil) */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* SCROLLBAR — histórico (mais visível) */
  .col-historico::-webkit-scrollbar { width: 7px; }
  .col-historico::-webkit-scrollbar-track {
    background: var(--surface2);
    border-radius: 4px;
    margin: 6px 0;
  }
  .col-historico::-webkit-scrollbar-thumb {
    background: #bbb;
    border-radius: 4px;
    border: 1px solid var(--surface2);
  }
  .col-historico::-webkit-scrollbar-thumb:hover { background: #999; }

  /* PAGAMENTO */
  .payment-btns { display: flex; gap: 10px; margin-bottom: 16px; }
  .btn-pay {
    flex: 1; padding: 18px 10px;
    border: 2px solid var(--border2); border-radius: 10px;
    background: var(--surface2);
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    letter-spacing: 0.05em; cursor: pointer; color: var(--text);
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .btn-pay:hover { border-color: var(--accent); }
  .btn-pay.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
  .troco-block { margin-top: 4px; }
  .troco-input {
    width: 100%; padding: 10px 12px;
    background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
    font-family: var(--mono); font-size: 15px; color: var(--text);
    margin-bottom: 8px; transition: border-color 0.15s;
  }
  .troco-input:focus { outline: none; border-color: var(--accent); }
  .troco-result { font-family: var(--mono); font-size: 20px; font-weight: 500; min-height: 28px; }
  .hist-pay {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
    padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 500;
  }
  .hist-pay.mbway    { background: #dbeafe; color: #1d4ed8; }
  .hist-pay.dinheiro { background: #dcfce7; color: #15803d; }
  .hist-troco { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* CALENDÁRIO DO HISTÓRICO */
  .hist-date-bar { margin-bottom: 10px; }
  .hist-date-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    margin-bottom: 0;
    transition: background 0.15s;
  }
  .hist-date-toggle:hover { background: #e5e3de; }
  .hist-date-toggle-label {
    font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--text);
  }
  .hist-date-toggle-arrow { font-size: 9px; color: var(--text-dim); }
  .hist-cal-panel {
    display: none;
    padding: 10px 0 4px;
  }
  .hist-cal-panel.open { display: block; }
  .hist-cal-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .hist-cal-nav-btn {
    background: none; border: 1px solid var(--border2); border-radius: 6px;
    cursor: pointer; font-size: 11px; color: var(--text-muted);
    padding: 3px 8px; line-height: 1;
    transition: background 0.1s, color 0.1s;
  }
  .hist-cal-nav-btn:hover { background: var(--surface2); color: var(--text); }
  .hist-cal-month {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--text); letter-spacing: 0.06em;
  }
  .hist-cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 2px; margin-bottom: 8px;
  }
  .hist-cal-dow {
    font-family: var(--mono); font-size: 9px; color: var(--text-dim);
    text-align: center; padding: 2px 0;
  }
  .hist-cal-day {
    font-family: var(--mono); font-size: 11px;
    text-align: center; padding: 5px 2px;
    border-radius: 5px; cursor: pointer; color: var(--text-muted);
    transition: background 0.1s;
  }
  .hist-cal-day:hover:not(.empty) { background: var(--surface2); }
  .hist-cal-day.empty { cursor: default; }
  .hist-cal-day.has-orders { background: #dcfce7; color: #15803d; font-weight: 600; }
  .hist-cal-day.has-orders:hover { background: #bbf7d0; }
  .hist-cal-day.is-today { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); font-weight: 600; }
  .hist-cal-day.is-today.has-orders { color: var(--accent); }
  .hist-cal-day.selected { background: var(--accent) !important; color: #fff !important; box-shadow: none !important; }
  .hist-day-summary {
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 10px;
    color: var(--text-muted); padding: 0 2px;
  }
  .hist-day-summary .sum-total { font-weight: 500; color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <img src="logo.png" alt="HOME Sushi & Asian Food"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
      <span class="logo-fallback" style="display:none;">HOME SUSHI</span>
    </div>
    <div style="margin-left:12px;">
      <div class="logo-sub">Sistema de Pedidos · Viseu</div>
    </div>
  </div>
  <div style="display:flex; align-items:center;">
    <div class="header-date" id="header-date"></div>
    <div class="server-status" onclick="openPrinterModal()" title="Configurar impressora">
      <div class="server-dot" id="server-dot"></div>
      <span class="server-label" id="server-label">a ligar...</span>
    </div>
  </div>
</header>

<div class="main">

  <!-- ESQUERDA: Produtos + Pedido -->
  <div class="col-left">

    <div class="col-produtos">
      <div class="section-label">Produtos</div>
      <div id="products-list"></div>
    </div>

    <div class="col-pedido">
      <div class="section-label">Pedido atual</div>
      <div class="edit-banner" id="edit-banner">
        <span id="edit-banner-text">A editar pedido</span>
        <button class="edit-banner-cancel" onclick="cancelEdit()" title="Cancelar edição">✕</button>
      </div>
      <div id="order-lines" class="order-lines">
        <div class="empty-msg">— vazio —</div>
      </div>
      <div class="obs-area">
        <span class="obs-label">Observações</span>
        <textarea class="obs-input" id="obs-input" placeholder="Sem glúten, alergia a amendoim..."></textarea>
      </div>
      <div class="total-block">
        <div class="total-label">Total</div>
        <div class="total-val" id="total-val">0,00 €</div>
      </div>
      <div class="btn-row">
        <button class="btn-finalize" id="btn-finalize" disabled onclick="finalizeOrder()">Finalizar Pedido</button>
        <button class="btn-print" id="btn-print" disabled onclick="printOrder()">Imprimir e Finalizar</button>
      </div>
      <button class="btn-clear" onclick="clearOrder()">Limpar pedido</button>
    </div>

  </div>

  <!-- HISTÓRICO -->
  <div class="col-historico">
    <div class="section-label">Histórico</div>
    <div class="hist-date-bar">
      <div class="hist-date-toggle" onclick="toggleCalendar()">
        <span class="hist-date-toggle-label" id="hist-date-toggle-label">—</span>
        <span class="hist-date-toggle-arrow" id="hist-date-toggle-arrow">▼</span>
      </div>
      <div class="hist-cal-panel" id="hist-cal-panel">
        <div id="hist-cal"></div>

</div>

<script>
const PRODUCTS = [
  { id: 'entrada',   cat: 'Entrada',    name: 'Ceviche',                price: 4.00 },
  { id: 'prato',     cat: 'Prato',      name: 'Sushi e Sashimi 6 peças', price: 7.00 },
  { id: 'sobremesa', cat: 'Sobremesa',  name: 'Chokoreto',              price: 3.00 },
];

let qty = {};
let history = [];
let orderCounter = 0;
let editingNum = null;
let selectedPayMethod = null;
let pendingAction = null;
let calYear  = new Date().getFullYear();
let calMonth = new Date().getMonth();
let selectedCalDate = new Date().toLocaleDateString('pt-PT');

PRODUCTS.forEach(p => qty[p.id] = 0);

// Atualiza data/hora no header
function updateClock() {
  const now = new Date();
  document.getElementById('header-date').textContent =
    now.toLocaleDateString('pt-PT', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }) +
    ' · ' + now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
}
updateClock();
setInterval(updateClock, 60000);

async function reprintOrder(index) {
  const o = history[index];
  if (!o) return;
  if (!serverOnline) { alert('Servidor offline.'); return; }
  if (!configuredPrinter) { openPrinterModal(); return; }

  try {
    const r = await fetch(SERVER + '/api/print', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        editNum: o.num,
        date: o.date, time: o.time,
        total: parseFloat(o.total),
        obs: o.obs || '',
        pagamento: o.pagamento || '',
        valor_entregue: o.valorEntregue || 0,
        troco: o.troco || 0,
        lines: o.lines.map(l => {
          const p = PRODUCTS.find(p => p.name === l.name);
          return { name: l.name, qty: l.qty, price: p ? p.price : 0 };
        }),
      }),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);
  } catch (e) {
    alert('Erro ao imprimir: ' + e.message);
  }
}

function loadOrderForEdit(index) {
  const o = history[index];
  if (!o) return;

  // Limpa pedido atual e carrega itens do histórico
  PRODUCTS.forEach(p => qty[p.id] = 0);
  o.lines.forEach(l => {
    const product = PRODUCTS.find(p => p.name === l.name);
    if (product) qty[product.id] = l.qty;
  });
  document.getElementById('obs-input').value = o.obs || '';

  // Activa modo de edição
  editingNum = o.num;
  const banner = document.getElementById('edit-banner');
  document.getElementById('edit-banner-text').textContent = `A editar pedido #${o.num}`;
  banner.classList.add('visible');

  renderProducts();
  renderOrder();
  // Scroll para o topo do painel
  document.querySelector('.col-pedido').scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editingNum = null;
  document.getElementById('edit-banner').classList.remove('visible');
  clearOrder();
}

function renderProducts() {
  document.getElementById('products-list').innerHTML = PRODUCTS.map(p => `
    <div class="product-row ${qty[p.id] > 0 ? 'active' : ''}" id="row-${p.id}">
      <div style="flex:1;">
        <div class="product-cat">${p.cat}</div>
        <div class="product-name">${p.name}</div>
      </div>
      <div class="product-price">${p.price.toFixed(2).replace('.', ',')} €</div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty('${p.id}', -1)">−</button>
        <span class="qty-num" id="qty-${p.id}">${qty[p.id]}</span>
        <button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button>
      </div>
    </div>
  `).join('');
}

function changeQty(id, delta) {
  qty[id] = Math.max(0, qty[id] + delta);
  const numEl = document.getElementById('qty-' + id);
  if (numEl) numEl.textContent = qty[id];
  const rowEl = document.getElementById('row-' + id);
  if (rowEl) rowEl.classList.toggle('active', qty[id] > 0);
  renderOrder();
}

function renderOrder() {
  const lines = PRODUCTS.filter(p => qty[p.id] > 0);
  const el  = document.getElementById('order-lines');
  const btn  = document.getElementById('btn-print');
  const btnF = document.getElementById('btn-finalize');

  if (!lines.length) {
    el.innerHTML = '<div class="empty-msg">— vazio —</div>';
    document.getElementById('total-val').textContent = '0,00 €';
    btn.disabled = true;
    btnF.disabled = true;
    return;
  }

  let total = 0;
  el.innerHTML = lines.map(p => {
    const sub = p.price * qty[p.id];
    total += sub;
    return `
      <div class="order-line">
        <div>
          <div class="ol-qty">${qty[p.id]}×</div>
          <div class="ol-name">${p.name}</div>
        </div>
        <div class="ol-sub">${sub.toFixed(2).replace('.', ',')} €</div>
      </div>`;
  }).join('');

  document.getElementById('total-val').textContent = total.toFixed(2).replace('.', ',') + ' €';
  btn.disabled = false;
  btn.textContent = 'Imprimir e Finalizar';
  btnF.disabled = false;
  btnF.textContent = 'Finalizar Pedido';
}

function buildTalao(lines, num, dateStr, timeStr, total, copia) {
  const rows = lines.map(p => {
    const sub = (p.price * qty[p.id]).toFixed(2).replace('.', ',');
    const name = p.name.length > 22 ? p.name.substring(0, 22) + '.' : p.name;
    return `<tr>
      <td style="padding:2px 0;">${name}</td>
      <td style="text-align:center; padding:2px 4px;">${qty[p.id]}</td>
      <td style="text-align:right; padding:2px 0;">${sub} €</td>
    </tr>`;
  }).join('');

  return `
    <div style="width:72mm; font-family:'Courier New', Courier, monospace; font-size:11px; padding:0 0 6mm 0;">
      <div style="text-align:center; margin-bottom:8px;">
        <div style="font-size:15px; font-weight:bold; letter-spacing:1px;">HOME SUSHI VISEU</div>
        <div style="font-size:10px; margin-top:2px;">Urb. Quinta del Rei, Lote 264 · 3500-613 Viseu</div>
        <div style="font-size:10px;">Tel: 232 396 351 | 933 330 867</div>
        <div style="font-size:10px;">viseu@homesushi.pt · NIF: 513 977 970</div>
      </div>
      <div style="border-top:1px dashed #000; margin:6px 0;"></div>
      <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:2px;">
        <span><b>Pedido #${num}</b></span>
        <span>${dateStr} ${timeStr}</span>
      </div>
      <div style="font-size:10px; text-align:right; font-style:italic; margin-bottom:4px;">${copia}</div>
      <div style="border-top:1px dashed #000; margin:6px 0;"></div>
      <table style="width:100%; border-collapse:collapse; font-size:11px;">
        <thead>
          <tr style="font-size:10px; border-bottom:1px solid #ccc;">
            <th style="text-align:left; font-weight:normal; padding-bottom:3px;">Item</th>
            <th style="text-align:center; font-weight:normal;">Qtd</th>
            <th style="text-align:right; font-weight:normal;">Sub</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="border-top:1px dashed #000; margin:6px 0;"></div>
      <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:bold;">
        <span>TOTAL</span>
        <span>${total.toFixed(2).replace('.', ',')} €</span>
      </div>
      <div style="border-top:1px dashed #000; margin:6px 0;"></div>
      <div style="text-align:center; font-size:10px; margin-top:6px;">
        Obrigado pela sua visita!<br>
        <span style="font-size:9px;">www.homesushi.pt</span>
      </div>
    </div>`;
}

const SERVER = 'http://localhost:5000';
let serverOnline = false;
let configuredPrinter = '';

async function checkServer() {
  try {
    const r = await fetch(SERVER + '/health', { signal: AbortSignal.timeout(1500) });
    if (r.ok) {
      const d = await r.json();
      serverOnline = true;
      configuredPrinter = d.printer || '';
      // sincroniza o contador com o servidor
      if (d.counter) orderCounter = d.counter;
    } else {
      serverOnline = false;
    }
  } catch {
    serverOnline = false;
  }
  const dot   = document.getElementById('server-dot');
  const label = document.getElementById('server-label');
  if (!serverOnline) {
    dot.className = 'server-dot offline';
    label.textContent = 'servidor offline';
  } else if (!configuredPrinter) {
    dot.className = 'server-dot offline';
    label.textContent = '⚙ configurar impressora';
  } else {
    dot.className = 'server-dot online';
    label.textContent = configuredPrinter.length > 22
      ? configuredPrinter.substring(0, 22) + '…'
      : configuredPrinter;
  }
}
async function loadHistory() {
  try {
    const r = await fetch(SERVER + '/api/history', { signal: AbortSignal.timeout(3000) });
    if (!r.ok) return;
    const d = await r.json();
    if (Array.isArray(d.history) && d.history.length) {
      // normaliza total para string (servidor devolve number, frontend usa string)
      history = d.history.slice().reverse().map(o => ({
        ...o,
        total: parseFloat(o.total).toFixed(2),
      }));
    }
  } catch (e) {
    console.warn('Erro ao carregar histórico:', e);
    return;
  }
  refreshHistoryUI();
}

checkServer().then(loadHistory);
setInterval(checkServer, 10000);

// ── Modal impressora ────────────────────────────────────────────────────────
async function openPrinterModal() {
  if (!serverOnline) return;
  document.getElementById('modal-printer').classList.add('open');
  const sel = document.getElementById('printer-select');
  sel.innerHTML = '<option value="">A carregar...</option>';
  try {
    const r = await fetch(SERVER + '/api/printers');
    const d = await r.json();
    sel.innerHTML = d.printers.map(p =>
      `<option value="${p}" ${p === d.selected ? 'selected' : ''}>${p}</option>`
    ).join('');
    if (!d.printers.length) sel.innerHTML = '<option value="">Nenhuma impressora encontrada</option>';
  } catch {
    sel.innerHTML = '<option value="">Erro ao listar impressoras</option>';
  }
}

function closeModal() {
  document.getElementById('modal-printer').classList.remove('open');
}

async function savePrinter() {
  const printer = document.getElementById('printer-select').value;
  if (!printer) return;
  await fetch(SERVER + '/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ printer }),
  });
  closeModal();
  await checkServer();
}

document.getElementById('modal-printer').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ── Modal pagamento ──────────────────────────────────────────────────────────

function getCurrentTotal() {
  let total = 0;
  PRODUCTS.filter(p => qty[p.id] > 0).forEach(p => total += p.price * qty[p.id]);
  return total;
}

function openPaymentModal(action) {
  selectedPayMethod = null;
  pendingAction = action;
  document.getElementById('btn-pay-mbway').classList.remove('selected');
  document.getElementById('btn-pay-dinheiro').classList.remove('selected');
  document.getElementById('troco-block').style.display = 'none';
  document.getElementById('valor-entregue').value = '';
  document.getElementById('troco-result').textContent = '';
  document.getElementById('btn-pay-confirm').disabled = true;
  document.getElementById('modal-payment').classList.add('open');
}

function closePaymentModal() {
  document.getElementById('modal-payment').classList.remove('open');
  pendingAction = null;
  selectedPayMethod = null;
}

function selectPayMethod(method) {
  selectedPayMethod = method;
  document.getElementById('btn-pay-mbway').classList.toggle('selected', method === 'MBWAY');
  document.getElementById('btn-pay-dinheiro').classList.toggle('selected', method === 'DINHEIRO');
  const trocoBlock = document.getElementById('troco-block');
  if (method === 'DINHEIRO') {
    trocoBlock.style.display = 'block';
    document.getElementById('btn-pay-confirm').disabled = true;
    document.getElementById('valor-entregue').focus();
  } else {
    trocoBlock.style.display = 'none';
    document.getElementById('btn-pay-confirm').disabled = false;
  }
}

function calcTroco() {
  const total = getCurrentTotal();
  const valor = parseFloat(document.getElementById('valor-entregue').value) || 0;
  const troco = valor - total;
  const el  = document.getElementById('troco-result');
  const btn = document.getElementById('btn-pay-confirm');
  if (valor > 0 && valor >= total) {
    el.textContent = `Troco: ${troco.toFixed(2).replace('.', ',')} €`;
    el.style.color = 'var(--accent)';
    btn.disabled   = false;
  } else if (valor > 0) {
    el.textContent = 'Valor insuficiente';
    el.style.color = 'var(--red)';
    btn.disabled   = true;
  } else {
    el.textContent = '';
    btn.disabled   = true;
  }
}

async function confirmPayment() {
  if (!selectedPayMethod) return;
  const total = getCurrentTotal();
  const pagamento = { metodo: selectedPayMethod, valorEntregue: 0, troco: 0 };
  if (selectedPayMethod === 'DINHEIRO') {
    const valor = parseFloat(document.getElementById('valor-entregue').value) || 0;
    pagamento.valorEntregue = valor;
    pagamento.troco = Math.max(0, valor - total);
  }
  const action = pendingAction; // guardar antes de closePaymentModal() fazer reset
  closePaymentModal();
  if (action === 'finalize') await doFinalize(pagamento);
  else if (action === 'print') await doPrint(pagamento);
}

document.getElementById('modal-payment').addEventListener('click', e => {
  if (e.target === e.currentTarget) closePaymentModal();
});

// ── Ações de pedido ──────────────────────────────────────────────────────────

async function finalizeOrder() {
  if (!PRODUCTS.filter(p => qty[p.id] > 0).length) return;
  if (!serverOnline) { alert('Servidor offline. Inicia o iniciar.bat primeiro.'); return; }
  openPaymentModal('finalize');
}

async function printOrder() {
  if (!PRODUCTS.filter(p => qty[p.id] > 0).length) return;
  if (!serverOnline) { alert('Servidor offline. Inicia o iniciar.bat primeiro.'); return; }
  if (!configuredPrinter) { openPrinterModal(); return; }
  openPaymentModal('print');
}

async function doFinalize(pagamento) {
  const lines = PRODUCTS.filter(p => qty[p.id] > 0);
  const now     = new Date();
  const dateStr = now.toLocaleDateString('pt-PT');
  const timeStr = now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
  let total = 0;
  lines.forEach(p => total += p.price * qty[p.id]);
  const obs = document.getElementById('obs-input').value.trim();

  const btnF = document.getElementById('btn-finalize');
  btnF.disabled = true;
  btnF.textContent = 'A guardar...';

  try {
    const r = await fetch(SERVER + '/api/finalize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: dateStr, time: timeStr, total, obs,
        editNum: editingNum,
        pagamento: pagamento.metodo,
        valor_entregue: pagamento.valorEntregue,
        troco: pagamento.troco,
        lines: lines.map(p => ({ name: p.name, qty: qty[p.id], price: p.price })),
      }),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);

    const num = data.num;
    if (!editingNum) orderCounter = parseInt(num) + 1;
    const entry = {
      num, date: dateStr, time: timeStr,
      lines: lines.map(p => ({ name: p.name, qty: qty[p.id] })),
      total: total.toFixed(2),
      pagamento: pagamento.metodo,
      valorEntregue: pagamento.valorEntregue,
      troco: pagamento.troco,
    };
    if (editingNum) {
      const idx = history.findIndex(o => o.num === editingNum);
      if (idx !== -1) history[idx] = entry; else history.unshift(entry);
    } else {
      history.unshift(entry);
    }
    refreshHistoryUI();
    clearOrder();
  } catch (e) {
    alert('Erro ao finalizar: ' + e.message);
    btnF.disabled = false;
    btnF.textContent = 'Finalizar';
  }
}

async function doPrint(pagamento) {
  const lines = PRODUCTS.filter(p => qty[p.id] > 0);
  const btn = document.getElementById('btn-print');

  const now     = new Date();
  const dateStr = now.toLocaleDateString('pt-PT');
  const timeStr = now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
  let total = 0;
  lines.forEach(p => total += p.price * qty[p.id]);

  btn.disabled    = true;
  btn.textContent = 'A imprimir...';

  const obs = document.getElementById('obs-input').value.trim();
  let num;

  try {
    const r = await fetch(SERVER + '/api/print', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: dateStr, time: timeStr, total, obs,
        editNum: editingNum,
        pagamento: pagamento.metodo,
        valor_entregue: pagamento.valorEntregue,
        troco: pagamento.troco,
        lines: lines.map(p => ({ name: p.name, qty: qty[p.id], price: p.price })),
      }),
    });
    const data = await r.json();
    if (!data.ok) {
      if (data.error === 'NO_PRINTER') { openPrinterModal(); return; }
      throw new Error(data.error);
    }
    num = data.num;
    if (!editingNum) orderCounter = parseInt(num) + 1;
  } catch (e) {
    alert('Erro de impressão: ' + e.message);
    btn.disabled    = false;
    btn.textContent = '⬡ Imprimir talão';
    return;
  }

  const entry = {
    num, date: dateStr, time: timeStr,
    lines: lines.map(p => ({ name: p.name, qty: qty[p.id] })),
    total: total.toFixed(2),
    pagamento: pagamento.metodo,
    valorEntregue: pagamento.valorEntregue,
    troco: pagamento.troco,
  };
  if (editingNum) {
    const idx = history.findIndex(o => o.num === editingNum);
    if (idx !== -1) history[idx] = entry; else history.unshift(entry);
  } else {
    history.unshift(entry);
  }
  renderHistory();
  clearOrder();
}

function clearOrder() {
  PRODUCTS.forEach(p => qty[p.id] = 0);
  document.getElementById('obs-input').value = '';
  editingNum = null;
  document.getElementById('edit-banner').classList.remove('visible');
  renderProducts();
  renderOrder();
}

// ── Calendário ───────────────────────────────────────────────────────────────

function renderCalendar() {
  const orderDates = new Set(history.map(o => o.date).filter(Boolean));
  const todayStr   = new Date().toLocaleDateString('pt-PT');
  const mNames     = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                      'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const firstDay   = new Date(calYear, calMonth, 1);
  const lastDay    = new Date(calYear, calMonth + 1, 0);
  const startDow   = (firstDay.getDay() + 6) % 7; // seg=0

  const emptySlots = Array.from({ length: startDow }, () =>
    `<div class="hist-cal-day empty"></div>`).join('');

  let dayHtml = '';
  for (let day = 1; day <= lastDay.getDate(); day++) {
    const dd      = String(day).padStart(2, '0');
    const mm      = String(calMonth + 1).padStart(2, '0');
    const dateStr = `${dd}/${mm}/${calYear}`;
    const cls     = ['hist-cal-day',
      orderDates.has(dateStr)       ? 'has-orders' : '',
      dateStr === todayStr          ? 'is-today'   : '',
      dateStr === selectedCalDate   ? 'selected'   : '',
    ].filter(Boolean).join(' ');
    dayHtml += `<div class="${cls}" onclick="selectCalDay('${dateStr}')">${day}</div>`;
  }

  document.getElementById('hist-cal').innerHTML = `
    <div class="hist-cal-nav">
      <button class="hist-cal-nav-btn" onclick="prevMonth()">◀</button>
      <span class="hist-cal-month">${mNames[calMonth]} ${calYear}</span>
      <button class="hist-cal-nav-btn" onclick="nextMonth()">▶</button>
    </div>
    <div class="hist-cal-grid">
      ${'Seg Ter Qua Qui Sex Sáb Dom'.split(' ').map(d =>
        `<div class="hist-cal-dow">${d}</div>`).join('')}
      ${emptySlots}${dayHtml}
    </div>`;
}

function toggleCalendar() {
  const panel = document.getElementById('hist-cal-panel');
  const arrow = document.getElementById('hist-date-toggle-arrow');
  const open  = panel.classList.toggle('open');
  arrow.textContent = open ? '▲' : '▼';
}

function updateToggleLabel() {
  const today = new Date().toLocaleDateString('pt-PT');
  const label = selectedCalDate === today ? `Hoje  ${selectedCalDate}` : selectedCalDate;
  document.getElementById('hist-date-toggle-label').textContent = label;
}

function prevMonth() {
  if (--calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

function nextMonth() {
  if (++calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function selectCalDay(dateStr) {
  selectedCalDate = dateStr;
  // fecha o calendário após selecionar
  document.getElementById('hist-cal-panel').classList.remove('open');
  document.getElementById('hist-date-toggle-arrow').textContent = '▼';
  renderCalendar();
  updateToggleLabel();
  renderHistory();
}

function refreshHistoryUI() {
  updateToggleLabel();
  renderCalendar();
  renderHistory();
}

// ── Histórico ─────────────────────────────────────────────────────────────────

function renderHistory() {
  const el       = document.getElementById('history-list');
  const summary  = document.getElementById('hist-day-summary');
  const filtered = history.filter(o => o.date === selectedCalDate);

  if (filtered.length) {
    const dayTotal = filtered.reduce((s, o) => s + parseFloat(o.total), 0);
    summary.innerHTML = `
      <span>${filtered.length} pedido${filtered.length !== 1 ? 's' : ''}</span>
      <span class="sum-total">${dayTotal.toFixed(2).replace('.', ',')} €</span>`;
  } else {
    summary.innerHTML = '';
  }

  if (!filtered.length) {
    el.innerHTML = '<div class="hist-empty">sem pedidos neste dia</div>';
    return;
  }

  el.innerHTML = filtered.map(o => {
    const i         = history.indexOf(o);
    const payBadge  = o.pagamento
      ? `<span class="hist-pay ${o.pagamento.toLowerCase()}">${o.pagamento}</span>` : '';
    const trocoLine = (o.pagamento === 'DINHEIRO' && o.troco > 0)
      ? `<div class="hist-troco">Troco: ${parseFloat(o.troco).toFixed(2).replace('.', ',')} €</div>` : '';
    return `
      <div class="hist-card">
        <div class="hist-header">
          <span class="hist-num">#${o.num}</span>
          <span class="hist-time">${o.time}</span>
          ${payBadge}
          <span class="hist-total">${o.total.replace('.', ',')} €</span>
        </div>
        <div class="hist-body">
          ${o.lines.map(l => `<div class="hist-item">${l.qty}× ${l.name}</div>`).join('')}
          ${trocoLine}
          <div style="margin-top:8px; display:flex; gap:6px;">
            <button class="btn-edit" onclick="loadOrderForEdit(${i})">Editar</button>
            <button class="btn-edit" onclick="reprintOrder(${i})">Imprimir</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

renderProducts();
renderOrder();
updateToggleLabel();
renderCalendar();
</script>
</body>
</html>
